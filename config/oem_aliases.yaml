# config/oem_aliases.yaml — canonicalize OEM names so a company's history stays continuous
# across renames and across sources (SIAM vs company disclosure vs FADA).
#
# Format:  canonical_name: [list, of, aliases, as, printed, by, sources]
# Matching is case-insensitive and ignores punctuation/whitespace (see lib/normalize.py).
#
# IMPORTANT: the SEED does not apply this map — the workbook column names ARE the canonical
# identities for the seeded history. This map is applied to LIVE source names so they land on
# the same entity as the seeded history. Any live `oem_raw` not resolvable here is NOT dropped:
# it is kept and flagged "unmapped OEM" by the audit for a human to add below.

aliases:
  Hero MotoCorp:
    - Hero Honda
    - Hero Honda Motors
    - Hero MotoCorp Ltd
    - Hero Motocorp

  Maruti Suzuki:
    - Maruti Udyog
    - Maruti Udyog Ltd
    - Maruti Suzuki India
    - Maruti Suzuki India Ltd
    - Maruti Suzuki India Limited

