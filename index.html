<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto OEM Trends Tracker</title>
  <meta name="description" content="Trend-first analytics for the Indian automobile industry — production, sales, market share and EV, by OEM." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M4 17l5-6 4 3 5-8' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Fonts: Inter + JetBrains Mono (graceful system fallbacks keep it readable offline). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="dashboard/css/main.css" />
</head>
<body>
  <!-- Loading veil ------------------------------------------------------------------->
  <div id="veil" class="veil">
    <div class="spinner" aria-label="Loading"></div>
    <div class="veil-text">Loading trends…</div>
  </div>

  <!-- Sticky header ------------------------------------------------------------------>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l5-6 4 3 5-7 4 5" />
          <circle cx="8" cy="11" r="0.6" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <div class="brand-txt">
        <h1>Auto OEM Trends</h1>
        <p>Production · Sales · Market Share · EV</p>
      </div>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Views"></nav>
  </header>

  <!-- Sticky filter bar -------------------------------------------------------------->
  <div class="filterbar" id="filterbar"></div>

  <!-- Main content grid -------------------------------------------------------------->
  <main class="main" id="main"></main>

  <!-- Footer ------------------------------------------------------------------------->
  <footer class="app-footer" id="footer">
    <span class="mono" id="footer-src">Sources: SIAM · internal OEM database</span>
    <span class="mono footer-meta" id="footer-meta"></span>
  </footer>

  <!-- ECharts (vendored locally so the dashboard works fully offline) ----------------->
  <script src="dashboard/js/vendor/echarts.min.js"></script>
  <!-- App (vanilla ES modules) ------------------------------------------------------->
  <script type="module" src="dashboard/js/app.js"></script>
</body>
</html>
